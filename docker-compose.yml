version: '3.8'

services:
  rswarm-dev:
    build: .
    container_name: rswarm-development
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000 --reload
    stdin_open: true
    tty: true
    depends_on:
      - redis

  rswarm-test:
    build: .
    container_name: rswarm-testing
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    command: pytest tests/ -v --tb=short
    depends_on:
      - redis

  rswarm-run:
    build: .
    container_name: rswarm-running
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    container_name: rswarm-redis
    ports:
      - "6379:6379"